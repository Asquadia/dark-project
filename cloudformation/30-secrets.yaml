# 30-secrets — Secrets Manager secrets used by NexusPlay components
# Random secrets are generated by Secrets Manager (GenerateSecretString).
# Placeholders (GitHub PAT, Slack webhook) are filled in later by the user.
AWSTemplateFormatVersion: '2010-09-09'
Description: NexusPlay secrets — DB password, Redis auth, app secret, GitHub PAT + Slack webhook placeholders.

Metadata:
  NexusPlay:
    Project: NexusPlay
    Component: secrets
    Env: poc

Resources:
  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: nexusplay-db-password
      Description: RDS PostgreSQL master password
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - { Key: Project, Value: NexusPlay }
        - { Key: Component, Value: secrets }

  RedisAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: nexusplay-redis-auth
      Description: ElastiCache Redis AUTH token
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - { Key: Project, Value: NexusPlay }
        - { Key: Component, Value: secrets }

  AppSecretSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: nexusplay-app-secret
      Description: Application session/JWT signing secret
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - { Key: Project, Value: NexusPlay }
        - { Key: Component, Value: secrets }

  GitHubPatSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: nexusplay-github-pat
      Description: GitHub PAT for CI/CD (placeholder — replace with real PAT)
      SecretString: '{"pat":"REPLACE_WITH_GITHUB_PAT"}'
      Tags:
        - { Key: Project, Value: NexusPlay }
        - { Key: Component, Value: secrets }

  SlackWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: nexusplay-slack-webhook
      Description: Slack incoming webhook for notifications (placeholder — replace with real URL)
      SecretString: '{"webhook_url":"REPLACE_WITH_SLACK_WEBHOOK"}'
      Tags:
        - { Key: Project, Value: NexusPlay }
        - { Key: Component, Value: secrets }

Outputs:
  DbPasswordSecretArn:    { Value: !Ref DbPasswordSecret,    Export: { Name: NexusPlay-DbPasswordSecretArn } }
  RedisAuthSecretArn:     { Value: !Ref RedisAuthSecret,     Export: { Name: NexusPlay-RedisAuthSecretArn } }
  AppSecretSecretArn:     { Value: !Ref AppSecretSecret,     Export: { Name: NexusPlay-AppSecretSecretArn } }
  GitHubPatSecretArn:     { Value: !Ref GitHubPatSecret,     Export: { Name: NexusPlay-GitHubPatSecretArn } }
  SlackWebhookSecretArn:  { Value: !Ref SlackWebhookSecret,  Export: { Name: NexusPlay-SlackWebhookSecretArn } }